name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows installer
    # windows-latest is VS 2026, which nvcc 12.8's host_config.h rejects; pin to VS 2022.
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install CUDA 12.8 toolkit (build; only cudart64_12.dll is bundled)
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.8.0'
          method: network
          sub-packages: '["nvcc", "cudart", "thrust", "cublas", "cublas_dev", "visual_studio_integration"]'

      - name: Stage cudart64_12.dll for bundling
        shell: pwsh
        run: |
          if (-not $env:CUDA_PATH) { Write-Error "CUDA_PATH is not set"; exit 1 }
          $src = "$env:CUDA_PATH\bin\cudart64_12.dll"
          if (-not (Test-Path -LiteralPath $src)) { Write-Error "cudart64_12.dll not found at $src"; exit 1 }
          New-Item -ItemType Directory -Force -Path "frontend/src-tauri/binaries/cuda" | Out-Null
          Copy-Item -LiteralPath $src -Destination "frontend/src-tauri/binaries/cuda/cudart64_12.dll" -Force -ErrorAction Stop

      - name: Configure portable Windows native build
        id: portability
        shell: pwsh
        run: |
          $cmakeHook = (Join-Path $env:GITHUB_WORKSPACE ".github/force-portable-ggml.cmake").Replace('\', '/')
          "CMAKE_PROJECT_INCLUDE=$cmakeHook" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTFLAGS=-C target-cpu=x86-64-v2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $buildDirectory = "target/x86_64-pc-windows-msvc/release"
          $configPath = (Join-Path $env:RUNNER_TEMP "tauri.windows-portable.conf.json").Replace('\', '/')
          @{
            build = @{ beforeBundleCommand = @{ script = "node .github/verify-portable-ggml.cjs $buildDirectory"; cwd = $env:GITHUB_WORKSPACE } }
            # Every resource listed: Tauri may merge this --config over tauri.conf.json or tauri.windows.conf.json.
            bundle = @{ resources = @{ "binaries/onnxruntime" = "."; "binaries/cuda/cudart64_12.dll" = "cudart64_12.dll" } }
          } |
            ConvertTo-Json -Depth 4 | Set-Content -Path $configPath -Encoding utf8
          "args=--config `"$configPath`"" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: release-cuda-v1
          cache-on-failure: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build llama-helper sidecar (CPU)
        shell: pwsh
        run: |
          cargo build --release -p llama-helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path "frontend/src-tauri/binaries" | Out-Null
          Copy-Item "target/release/llama-helper.exe" -Destination "frontend/src-tauri/binaries/llama-helper-x86_64-pc-windows-msvc.exe"

      - name: Cache FFmpeg binary
        uses: actions/cache@v4
        with:
          path: frontend/src-tauri/binaries/ffmpeg-*.exe
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('frontend/src-tauri/build.rs', 'frontend/src-tauri/build/ffmpeg.rs') }}

      - name: Cache Windows ONNX Runtime
        uses: actions/cache@v4
        with:
          path: frontend/src-tauri/binaries/onnxruntime
          key: ${{ runner.os }}-onnxruntime-x86_64-pc-windows-msvc-${{ hashFiles('frontend/src-tauri/build/onnxruntime.rs') }}

      - name: Refuse to overwrite an already-published release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$draft" = "false" ]; then echo "::error::Release $GITHUB_REF_NAME is already published; tag a new version instead"; exit 1; fi
          fi

      - name: Build installer (draft release on tag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CMAKE_CUDA_ARCHITECTURES: '89'
        with:
          projectPath: frontend
          args: --target x86_64-pc-windows-msvc --bundles nsis --features cuda ${{ steps.portability.outputs.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Conclave {0}', github.ref_name) || '' }}
          releaseBody: 'New in 1.0.0: token usage is counted for every summary, with the cost per meeting, a Stats page (cost and talk time) and editable prices under Settings → Costs. Search across titles, transcripts, summaries and notes, and jump to the matching line. Tasks are extracted from each summary and collected on the Tasks page. A notification bell lists new items. Settings → Knowledge sets the model for these features and connects Google Calendar with your secret iCal address: recordings are titled from the calendar event, and summaries no longer rename calendar or your own titles. Pre-meeting briefs show a toast and are kept on the Briefs & digests page, which also gets a Friday weekly digest. Ask questions over your meetings and get answers with citations. Fixes: Claude requests no longer send temperature. Privacy: meeting titles and folder paths are no longer written to log files. Unsigned build: on first install choose "More info → Run anyway". GPU transcription needs the CUDA 12 toolkit (cuBLAS) — see CUDA_SETUP.md in the repo; without it Whisper runs on CPU. To update: quit Conclave from the tray icon (right-click → Quit), uninstall the old version in Windows Settings → Apps and leave ''delete app data'' unticked (meetings, settings and models are kept), then run this setup. Summaries use your own cloud LLM key: Settings → Summary (default Claude Haiku 5.5).'
          releaseDraft: true
          includeUpdaterJson: false

      - name: Check installer size (limit 100,000,000 bytes)
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe)
          if ($installers.Count -eq 0) { Write-Error "no NSIS installer found in target/x86_64-pc-windows-msvc/release/bundle/nsis"; exit 1 }
          foreach ($installer in $installers) {
            Write-Host ("{0}: {1:N0} bytes" -f $installer.Name, $installer.Length)
            if ($installer.Length -gt 100000000) { Write-Error ("{0} is over 100,000,000 bytes" -f $installer.Name); exit 1 }
          }

      - name: Verify CUDA DLLs are delay-loaded, not hard imports
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/Conclave.exe"
          if (-not (Test-Path $exe)) { Write-Error "Expected $exe (mainBinaryName); found: $(Get-ChildItem target/x86_64-pc-windows-msvc/release/*.exe | Select-Object -ExpandProperty Name)"; exit 1 }
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $imports = & $dumpbin /imports $exe | Out-String
          $split = $imports.IndexOf("Section contains the following delay load imports")
          if ($split -lt 0) { Write-Error "no delay-load import section in $exe"; exit 1 }
          $normal = $imports.Substring(0, $split); $delayed = $imports.Substring($split)
          # dumpbin prints one DLL name per line: match whole lines so cublas64_12.dll never matches cublasLt64_12.dll
          function Test-Import($section, $dll) { $section -match ('(?im)^\s*' + [regex]::Escape($dll) + '\s*$') }
          # cudart64_12.dll may be a normal import: it ships next to the exe.
          if (-not (Test-Import $delayed "cublas64_12.dll")) { Write-Error "cublas64_12.dll missing from delay-load imports"; exit 1 }
          foreach ($dll in "cublas64_12.dll", "cublasLt64_12.dll", "nvcuda.dll") {
            if (Test-Import $normal $dll) { Write-Error "$dll is a normal import (app would fail to start without CUDA)"; exit 1 }
          }
          Write-Host "OK: cuBLAS and the driver are delay-loaded"

      - name: Smoke test - app starts without CUDA on PATH
        shell: pwsh
        run: |
          # Simulate the installed layout: cudart sits next to the exe.
          $exe = "target/x86_64-pc-windows-msvc/release/Conclave.exe"
          if (-not (Test-Path $exe)) { Write-Error "Expected $exe (mainBinaryName); found: $(Get-ChildItem target/x86_64-pc-windows-msvc/release/*.exe | Select-Object -ExpandProperty Name)"; exit 1 }
          Copy-Item -LiteralPath "frontend/src-tauri/binaries/cuda/cudart64_12.dll" -Destination (Join-Path (Split-Path $exe) "cudart64_12.dll") -Force -ErrorAction Stop
          # The bundled ONNX Runtime and DirectML sit next to the exe too, as the installer lays them out.
          Copy-Item -Path "frontend/src-tauri/binaries/onnxruntime/*" -Destination (Split-Path $exe) -Force -ErrorAction Stop
          # Missing DLLs exit instead of showing a modal dialog; child processes inherit the error mode.
          Add-Type -Namespace Win32 -Name ErrorMode -MemberDefinition '[DllImport("kernel32.dll")] public static extern uint SetErrorMode(uint uMode);'
          [Win32.ErrorMode]::SetErrorMode(0x8001) | Out-Null  # SEM_FAILCRITICALERRORS | SEM_NOOPENFILEERRORBOX
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'CUDA' }) -join ';'
          $env:CUDA_PATH = $null
          # The app logs to stderr (main.rs), so capture it to find the ONNX Runtime init line.
          $errLog = Join-Path $env:RUNNER_TEMP "conclave-smoke-stderr.log"
          $p = Start-Process -FilePath $exe -PassThru -RedirectStandardError $errLog
          $null = $p.Handle  # keeps the handle open so $p.ExitCode is reliable if the exe dies at once
          Start-Sleep -Seconds 20
          if ($p.HasExited) {
            # Any exit within 20 s fails: a CUDA DLL problem is one cause, but so is any other startup crash.
            $code = $p.ExitCode
            $why = if ($code -eq -1073741515) { " (STATUS_DLL_NOT_FOUND)" } elseif ($code -eq -1066598274) { " (delay-load DLL not found)" } else { "" }
            Write-Error ("app exited within 20 s without CUDA on PATH: exit code {0} (0x{1:X8}){2}" -f $code, $code, $why)
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          # A failed DirectML preload only logs a warning, so its success line is required too.
          foreach ($line in 'Initialized bundled ONNX Runtime', 'Preloaded bundled DirectML') {
            if (-not (Select-String -Path $errLog -Pattern $line -Quiet)) {
              Write-Error "app log has no '$line' line; the bundled runtime did not load"
              exit 1
            }
          }
          Write-Host "OK: app stayed up 20s without CUDA on PATH; bundled ONNX Runtime and DirectML loaded"

      - name: Publish release (only after the checks above pass)
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Upload installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conclave-windows-x64-setup
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
